[build-system]
# 77 is the first setuptools that reads PEP 639's `license = "MIT"` string and
# `license-files`.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "samebytes"
dynamic = ["version"]
description = "Are these the same bytes? Check a working tree against git's index, a host's arithmetic against a recorded reference, and two pandas runs against each other, without fooling yourself; plus a git hook that repairs the stat cache in a synced folder."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Logan M Edwards" }]
keywords = [
    "bit-identity", "reproducibility", "hash", "pandas", "csv", "git",
    "onedrive", "google-drive", "synced-folder", "libm", "regression",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: Scientific/Engineering",
]

# None.  numpy and pandas are imported inside the functions that need them
# (frames, and parity's numpy/pandas probes), so installing this can never
# move a version a consumer has pinned; tests hold it to that.
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7.0", "numpy", "pandas"]

[project.urls]
Repository = "https://github.com/loggger101/samebytes"

[tool.setuptools]
packages = ["samebytes"]

# The sh hooks ship inside the package; `samebytes.hooks.install` copies them.
[tool.setuptools.package-data]
samebytes = ["hooks/drive-restat.sh", "hooks/post-checkout", "hooks/post-merge", "hooks/post-rewrite"]

[tool.setuptools.dynamic]
version = { attr = "samebytes.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
